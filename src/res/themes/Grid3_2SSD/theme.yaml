---
# Grid3_2SSD: three columns (CPU/GPU | RAM/SSD 1/SSD 2 | time/date/network) for Turing 3.5" (rev. A), landscape.
# Values marked as CUSTOM come from classes in library/sensors/sensors_custom.py (block "Grid3_2SSD").
author: "TuringScreen Grid3_2SSD"

display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 0, 0, 255

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 480
    HEIGHT: 320

STATS:
  CPU:
    TEMPERATURE:
      INTERVAL: 2
      TEXT:
        SHOW: True
        SHOW_UNIT: False
        X: 68
        Y: 33
        WIDTH: 54
        HEIGHT: 23
        ANCHOR: rm
        FONT: geforce/GeForce-Bold.ttf
        FONT_SIZE: 19
        FONT_COLOR: 0, 0, 0
        BACKGROUND_IMAGE: background.png
    FREQUENCY:
      INTERVAL: 2
      TEXT:
        SHOW: True
        SHOW_UNIT: False
        X: 68
        Y: 60
